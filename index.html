
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Deadline Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📚 Assignment Deadline Tracker</h1>

        <div class="form">
            <label for="assignmentName">Assignment Name</label>
            <input
                type="text"
                id="assignmentName"
                placeholder="Example: Database Homework"
            >

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" required>

            <label for="hoursRemaining">Hours Remaining</label>
            <input
                type="number"
                id="hoursRemaining"
                min="0"
                step="0.5"
                placeholder="Example: 3"
            >

            <button type="button" id="addBtn">Add Assignment</button>
        </div>

        <hr>

        <h2>Dashboard</h2>
        <div id="dashboard"></div>

        <h2>Upcoming Assignments (Next 7 Days)</h2>
        <div id="upcomingList"></div>

        <h2>All Assignments</h2>
        <div id="assignmentList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
